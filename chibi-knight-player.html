<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chibi Knight — Ruffle Player</title>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.7.0-nightly.2026.10.4/ruffle.js"></script>
<style>
:root{--bg:#1d2233;--panel:#262d44;--ink:#eef0f7;--accent:#f0c35a;--accent-ink:#2a2000;
--dim:color-mix(in srgb,var(--ink) 62%,var(--panel));
--line:color-mix(in srgb,var(--ink) 22%,var(--panel));
--btn:color-mix(in srgb,var(--ink) 12%,var(--panel));
--btn-hover:color-mix(in srgb,var(--ink) 22%,var(--panel));
--field:color-mix(in srgb,#000 28%,var(--panel));
--glow:color-mix(in srgb,var(--accent) 14%,var(--bg))}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 0,var(--glow),var(--bg) 60%);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 12px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.02em;color:var(--accent)}
p.sub{margin:0 0 16px;color:var(--dim);font-size:.9rem}
.frame{width:min(100%,820px);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 10px 30px #0006}
.frame.rounded0{border-radius:0}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--field);cursor:pointer}
#custom{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap;gap:12px}
#custom.show{display:flex}
#custom label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--dim)}
#stage{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:4px;overflow:hidden}
#stage ruffle-player,#stage ruffle-embed{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb,var(--bg) 82%,transparent);z-index:5;text-align:center;padding:16px}
#overlay.hide{display:none}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--btn-hover)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.big{background:var(--accent);color:var(--accent-ink);font-weight:bold;font-size:1.1rem;padding:12px 28px;border:0}
button.big:hover{filter:brightness(1.12)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.bar label{font-size:.85rem;color:var(--dim);display:flex;align-items:center;gap:6px}
select{font:inherit;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
input[type=range]{accent-color:var(--accent);width:90px}
.spacer{flex:1}
#msg{min-height:1.2em;margin-top:8px;font-size:.85rem;color:var(--dim)}
.hint{margin-top:12px;font-size:.85rem;color:var(--dim);max-width:820px}
</style>
</head>
<body>
<h1>Chibi Knight</h1>
<p class="sub">Flash game running on the Ruffle emulator — no plugin needed.</p>

<div class="frame">
  <div id="stage">
    <div id="overlay">
      <button class="big" id="start">▶ Play</button>
      <span style="color:var(--dim);font-size:.85rem">Click to start (browsers need a click before audio can play)</span>
    </div>
  </div>
  <div class="bar">
    <button id="pause">Pause</button>
    <button id="restart">Restart</button>
    <button id="full">Fullscreen</button>
    <label>Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="1"></label>
    <span class="spacer"></span>
    <label>Quality
      <select id="quality">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high" selected>High</option>
        <option value="best">Best</option>
      </select>
    </label>
    <label>Scale
      <select id="scale">
        <option value="showAll" selected>Fit</option>
        <option value="exactFit">Stretch</option>
        <option value="noBorder">Fill</option>
        <option value="noScale">Original</option>
      </select>
    </label>
  </div>
  <div class="bar" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
    <label>Theme
      <select id="theme">
        <option value="knight">Knight</option>
        <option value="parchment">Parchment</option>
        <option value="slime">Slime</option>
        <option value="sakura">Sakura</option>
        <option value="gameboy">Game Boy</option>
        <option value="midnight">Midnight</option>
        <option value="custom">Custom…</option>
      </select>
    </label>
    <button id="resetTheme">Reset</button>
  </div>
  <div id="custom">
    <label>Background <input type="color" id="c-bg"></label>
    <label>Panel <input type="color" id="c-panel"></label>
    <label>Text <input type="color" id="c-ink"></label>
    <label>Accent <input type="color" id="c-accent"></label>
  </div>
  <div id="msg" role="status"></div>
</div>
<p class="hint">Tip: click inside the game first so it receives your keyboard. Original size is 640×480.</p>

const stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),msg=document.getElementById('msg');
let player=null,paused=false;
const bytes=()=>Uint8Array.from(atob(SWF_B64),c=>c.charCodeAt(0));

function load(){
  if(!window.RufflePlayer){msg.textContent="Ruffle failed to load. Check your internet connection (it loads from a CDN).";return;}
  if(player){player.remove();}
  const ruffle=window.RufflePlayer.newest();
  player=ruffle.createPlayer();
  stage.appendChild(player);
  player.load({
    data:bytes(),
    autoplay:"on",
    unmuteOverlay:"hidden",
    splashScreen:false,
    letterbox:"on",
    quality:document.getElementById('quality').value,
    scale:document.getElementById('scale').value,
    contextMenu:"rightClickOnly",
    allowScriptAccess:false
  }).then(()=>{msg.textContent="";paused=false;document.getElementById('pause').textContent="Pause";player.volume=+document.getElementById('vol').value;player.focus();})
    .catch(e=>{msg.textContent="Could not load the game: "+e;});
}
document.getElementById('start').onclick=()=>{overlay.classList.add('hide');load();};
document.getElementById('restart').onclick=()=>{overlay.classList.add('hide');load();};
document.getElementById('pause').onclick=e=>{
  if(!player)return;
  if(paused){player.play();e.target.textContent="Pause";}else{player.pause();e.target.textContent="Resume";}
  paused=!paused;
};
document.getElementById('full').onclick=()=>{
  if(!player)return;
  if(player.enterFullscreen)player.enterFullscreen();else stage.requestFullscreen&&stage.requestFullscreen();
};
document.getElementById('vol').oninput=e=>{if(player)player.volume=+e.target.value;};
['quality','scale'].forEach(id=>document.getElementById(id).onchange=()=>{if(player){overlay.classList.add('hide');load();}});

/* ---------- Themes ---------- */
const THEMES={
  knight:   {bg:"#1d2233",panel:"#262d44",ink:"#eef0f7",accent:"#f0c35a"},
  parchment:{bg:"#e8dcc0",panel:"#f5ecd5",ink:"#3b2a18",accent:"#8c2f1b"},
  slime:    {bg:"#10261a",panel:"#173523",ink:"#e4f7e8",accent:"#6ee08a"},
  sakura:   {bg:"#fbe3ea",panel:"#fff3f6",ink:"#4a2434",accent:"#e0457b"},
  gameboy:  {bg:"#9bbc0f",panel:"#8bac0f",ink:"#0f380f",accent:"#306230"},
  midnight: {bg:"#0b0d14",panel:"#151926",ink:"#dfe3f2",accent:"#8b7cff"}
};
const root=document.documentElement;
function lum(h){const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255);}
function applyColors(c){
  root.style.setProperty('--bg',c.bg);root.style.setProperty('--panel',c.panel);
  root.style.setProperty('--ink',c.ink);root.style.setProperty('--accent',c.accent);
  root.style.setProperty('--accent-ink',lum(c.accent)>.4?'#1a1a1a':'#ffffff');
}
function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function fetchStore(k){try{return localStorage.getItem(k);}catch(e){return null;}}
const themeSel=document.getElementById('theme'),customBox=document.getElementById('custom');
const pick={bg:document.getElementById('c-bg'),panel:document.getElementById('c-panel'),ink:document.getElementById('c-ink'),accent:document.getElementById('c-accent')};
function readPickers(){return {bg:pick.bg.value,panel:pick.panel.value,ink:pick.ink.value,accent:pick.accent.value};}
function setTheme(name,save=true){
  themeSel.value=name;
  customBox.classList.toggle('show',name==='custom');
  if(name==='custom'){
    let saved=null;try{saved=JSON.parse(fetchStore('ck-custom'));}catch(e){}
    const c=saved||readPickers();
    for(const k in pick)pick[k].value=c[k]||THEMES.knight[k];
    applyColors(readPickers());
  }else{
    applyColors(THEMES[name]);
    for(const k in pick)pick[k].value=THEMES[name][k];
  }
  if(save)store('ck-theme',name);
}
themeSel.onchange=()=>{
  if(themeSel.value==='custom'){ // start custom from the current look
    const cur=readPickers();store('ck-custom',JSON.stringify(cur));
  }
  setTheme(themeSel.value);
};
for(const k in pick)pick[k].oninput=()=>{
  if(themeSel.value!=='custom'){themeSel.value='custom';customBox.classList.add('show');store('ck-theme','custom');}
  const c=readPickers();applyColors(c);store('ck-custom',JSON.stringify(c));
};
document.getElementById('resetTheme').onclick=()=>{store('ck-custom','');setTheme('knight');};
setTheme(fetchStore('ck-theme')&&(THEMES[fetchStore('ck-theme')]||fetchStore('ck-theme')==='custom')?fetchStore('ck-theme'):'knight',false);
</script>
